[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tui-trello"
dynamic = ["version"]
description = "A keyboard-first terminal client for Trello"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phil Nicholls" }]
keywords = ["trello", "tui", "terminal", "textual", "kanban", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
    "markdown-it-py[linkify]>=3",
    "rich>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-dev>=1.7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/philjnicholls/tui-trello"
Source = "https://github.com/philjnicholls/tui-trello"
Issues = "https://github.com/philjnicholls/tui-trello/issues"
Changelog = "https://github.com/philjnicholls/tui-trello/blob/main/CHANGELOG.md"

[project.scripts]
tui-trello = "tui_trello.cli:main"

[tool.hatch.version]
path = "src/tui_trello/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_trello"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["rich.style.Style"]
