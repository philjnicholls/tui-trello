[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui-trello"
version = "0.1.0"
description = "A keyboard-first terminal client for Trello"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
    "markdown-it-py[linkify]>=3",
    "rich>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-dev>=1.7"]

[project.scripts]
tui-trello = "tui_trello.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_trello"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
