name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the workflow, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like tui-trello to do?
      description: A key, a view, a command-line option. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
